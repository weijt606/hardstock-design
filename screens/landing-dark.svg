<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="Hardstock landing page in the night-yellow theme">
<rect width="900" height="480" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" fill="#18150f" stroke="#f6eedb" stroke-width="2"/><rect x="22" y="22" width="24" height="24" fill="#f6eedb"/><rect x="20" y="20" width="24" height="24" fill="#ffc72c" stroke="#f6eedb" stroke-width="2"/><text x="56" y="39" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="17" font-weight="700" fill="#f6eedb" text-anchor="start">Hardstock</text><text x="504.5" y="39" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="400" fill="#f6eedb" text-anchor="start">grammar</text><text x="585.25" y="39" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="400" fill="#f6eedb" text-anchor="start">components</text><text x="687.75" y="39" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="400" fill="#f6eedb" text-anchor="start">print</text><rect x="750" y="20" width="130" height="30" fill="#f6eedb"/><rect x="748" y="18" width="130" height="30" fill="#ffc72c" stroke="#f6eedb" stroke-width="2"/><text x="813" y="37.32" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="12" font-weight="700" fill="#1c1915" text-anchor="middle">Read the spec</text><line x1="1" y1="64" x2="899" y2="64" stroke="#f6eedb" stroke-width="2"/><rect x="334" y="102" width="236" height="24" fill="#f6eedb"/><rect x="332" y="100" width="236" height="24" fill="#252015" stroke="#f6eedb" stroke-width="2"/><text x="450" y="116" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#f6eedb" text-anchor="middle" letter-spacing="1">NEO-BRUTALIST DESIGN LANGUAGE</text><text x="450" y="176" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="40" font-weight="700" fill="#f6eedb" text-anchor="middle">Taste is not a vibe.</text><rect x="322" y="194" width="256" height="44" fill="#ffc72c" stroke="#f6eedb" stroke-width="0"/><text x="450" y="227" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="40" font-weight="700" fill="#1c1915" text-anchor="middle">Write it down.</text><text x="450" y="264" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#a8a08c" text-anchor="middle">Exact values, an explicit line between what may move and what may not,</text><text x="450" y="284" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="14" font-weight="400" fill="#a8a08c" text-anchor="middle">and rules a machine can check. Screen and print.</text><rect x="294" y="312" width="150" height="38" fill="#f6eedb"/><rect x="292" y="310" width="150" height="38" fill="#ffc72c" stroke="#f6eedb" stroke-width="2"/><text x="367" y="334.04" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="14" font-weight="700" fill="#1c1915" text-anchor="middle">Get started</text><rect x="460" y="312" width="150" height="38" fill="#f6eedb"/><rect x="458" y="310" width="150" height="38" fill="#252015" stroke="#f6eedb" stroke-width="2"/><text x="533" y="334.04" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="14" font-weight="700" fill="#f6eedb" text-anchor="middle">See the rules</text><line x1="1" y1="386" x2="899" y2="386" stroke="#f6eedb" stroke-width="2"/><rect x="2" y="388" width="896" height="90" fill="#252015"/><rect x="32" y="410" width="26" height="26" fill="#f6eedb"/><rect x="30" y="408" width="26" height="26" fill="#ffc72c" stroke="#f6eedb" stroke-width="2"/><text x="43" y="426" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="700" fill="#1c1915" text-anchor="middle">01</text><text x="68" y="421" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="15" font-weight="700" fill="#f6eedb" text-anchor="start">The grammar</text><text x="68" y="440" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="11.5" font-weight="400" fill="#f6eedb" text-anchor="start">Hard borders, offset shadows,</text><text x="68" y="456" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="11.5" font-weight="400" fill="#f6eedb" text-anchor="start">square corners, one accent.</text><rect x="324" y="410" width="26" height="26" fill="#f6eedb"/><rect x="322" y="408" width="26" height="26" fill="#252015" stroke="#f6eedb" stroke-width="2"/><text x="335" y="426" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="700" fill="#f6eedb" text-anchor="middle">02</text><text x="360" y="421" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="15" font-weight="700" fill="#f6eedb" text-anchor="start">The skin</text><text x="360" y="440" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="11.5" font-weight="400" fill="#f6eedb" text-anchor="start">Three variables move. Canvas,</text><text x="360" y="456" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="11.5" font-weight="400" fill="#f6eedb" text-anchor="start">ink, accent. Nothing else.</text><rect x="616" y="410" width="26" height="26" fill="#f6eedb"/><rect x="614" y="408" width="26" height="26" fill="#252015" stroke="#f6eedb" stroke-width="2"/><text x="627" y="426" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="700" fill="#f6eedb" text-anchor="middle">03</text><text x="652" y="421" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="15" font-weight="700" fill="#f6eedb" text-anchor="start">The proof</text><text x="652" y="440" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="11.5" font-weight="400" fill="#f6eedb" text-anchor="start">A validator that fails the build,</text><text x="652" y="456" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="11.5" font-weight="400" fill="#f6eedb" text-anchor="start">and a test that proves it fires.</text>
</svg>
