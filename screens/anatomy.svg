<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Anatomy of a Hardstock block: 2px ink border, zero-blur offset shadow, square corners, 24px padding">
<rect width="900" height="360" fill="#fff8f4"/>
<rect width="900" height="360" fill="#fff8f4"/><rect x="302" y="98" width="300" height="150" fill="#1c1915"/><rect x="300" y="96" width="300" height="150" fill="#ffeef2" stroke="#1c1915" stroke-width="2"/><text x="324" y="130" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">OPEN TASK</text><text x="324" y="158" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#1c1915" text-anchor="start">One block</text><text x="324" y="180" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">Tiled, never nested.</text><rect x="326" y="198" width="80" height="30" fill="#1c1915"/><rect x="324" y="196" width="80" height="30" fill="#ff8db4" stroke="#1c1915" stroke-width="2"/><text x="364" y="215.68" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="13" font-weight="700" fill="#1c1915" text-anchor="middle">Take it</text><path d="M300 116 L150 116" stroke="#1c1915" stroke-width="1" stroke-dasharray="3 3"/><rect x="297.5" y="113.5" width="5" height="5" fill="#1c1915"/><text x="24" y="108" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">01  BORDER</text><text x="24" y="128" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">2px solid ink, on every</text><text x="24" y="146" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">grouped or interactive thing</text><path d="M602 248 L690 286" stroke="#1c1915" stroke-width="1" stroke-dasharray="3 3"/><rect x="599.5" y="245.5" width="5" height="5" fill="#1c1915"/><text x="660" y="306" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">02  SHADOW</text><text x="660" y="326" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">Offset 2px down and right.</text><text x="660" y="344" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">Blur is always zero.</text><path d="M574 96 L600 96 L600 122" stroke="#ff8db4" stroke-width="4" fill="none"/><path d="M602 96 L654 70" stroke="#1c1915" stroke-width="1" stroke-dasharray="3 3"/><rect x="597.5" y="93.5" width="5" height="5" fill="#1c1915"/><text x="662" y="64" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">03  CORNER</text><text x="662" y="84" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">Radius 0, everywhere.</text><text x="662" y="102" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">Avatars and toggles too.</text><path d="M324 158 L324 112 L394 112" fill="none" stroke="#1c1915" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><path d="M300 136 L324 136" stroke="#1c1915" stroke-width="1"/><path d="M304 132 L300 136 L304 140" fill="none" stroke="#1c1915" stroke-width="1"/><path d="M320 132 L324 136 L320 140" fill="none" stroke="#1c1915" stroke-width="1"/><path d="M312 136 L150 292" stroke="#1c1915" stroke-width="1" stroke-dasharray="3 3"/><rect x="309.5" y="133.5" width="5" height="5" fill="#1c1915"/><text x="24" y="308" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">04  PADDING</text><text x="24" y="328" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">24px, from a 4px base scale</text><text x="24" y="36" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">ANATOMY OF ONE BLOCK</text>
</svg>
