<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Shadow scale and button press states">
<rect width="900" height="330" fill="#fff8f4"/>
<rect width="900" height="330" fill="#fff8f4"/><text x="24" y="36" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">SHADOW SCALE, BLUR ALWAYS ZERO</text><rect x="25" y="67" width="130" height="76" fill="#1c1915"/><rect x="24" y="66" width="130" height="76" fill="#ffffff" stroke="#1c1915" stroke-width="2"/><text x="89" y="110" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#1c1915" text-anchor="middle">1px</text><text x="24" y="170" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">XS</text><text x="24" y="188" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="12" font-weight="400" fill="#56606b" text-anchor="start">pressed, tooltips</text><rect x="201" y="68" width="130" height="76" fill="#1c1915"/><rect x="199" y="66" width="130" height="76" fill="#ffffff" stroke="#1c1915" stroke-width="2"/><text x="264" y="110" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#1c1915" text-anchor="middle">2px</text><text x="199" y="170" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">SM</text><text x="199" y="188" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="12" font-weight="400" fill="#56606b" text-anchor="start">cards, buttons</text><rect x="378" y="70" width="130" height="76" fill="#1c1915"/><rect x="374" y="66" width="130" height="76" fill="#ffffff" stroke="#1c1915" stroke-width="2"/><text x="439" y="110" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#1c1915" text-anchor="middle">4px</text><text x="374" y="170" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">MD</text><text x="374" y="188" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="12" font-weight="400" fill="#56606b" text-anchor="start">hover, toasts</text><rect x="555" y="72" width="130" height="76" fill="#1c1915"/><rect x="549" y="66" width="130" height="76" fill="#ffffff" stroke="#1c1915" stroke-width="2"/><text x="614" y="110" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#1c1915" text-anchor="middle">6px</text><text x="549" y="170" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">LG</text><text x="549" y="188" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="12" font-weight="400" fill="#56606b" text-anchor="start">hero, modals</text><line x1="24" y1="196" x2="876" y2="196" stroke="#1c1915" stroke-width="2"/><text x="24" y="226" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="700" fill="#1c1915" text-anchor="start" letter-spacing="1">PRESS: DISPLACEMENT, NEVER SCALE</text><rect x="432" y="242" width="110" height="34" fill="#1c1915"/><rect x="430" y="240" width="110" height="34" fill="#ff8db4" stroke="#1c1915" stroke-width="2"/><text x="485" y="261.68" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="13" font-weight="700" fill="#1c1915" text-anchor="middle">Take it</text><text x="430" y="296" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">DEFAULT</text><rect x="593" y="243" width="110" height="34" fill="#1c1915"/><rect x="592" y="242" width="110" height="34" fill="#ff8db4" stroke="#1c1915" stroke-width="2"/><text x="647" y="263.68" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="13" font-weight="700" fill="#1c1915" text-anchor="middle">Take it</text><text x="590" y="296" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">HOVER</text><rect x="752" y="242" width="110" height="34" fill="#ff8db4" stroke="#1c1915" stroke-width="2"/><text x="807" y="263.68" font-family='"Space Grotesk", system-ui, -apple-system, sans-serif' font-size="13" font-weight="700" fill="#1c1915" text-anchor="middle">Take it</text><text x="750" y="296" font-family='"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10" font-weight="700" fill="#56606b" text-anchor="start" letter-spacing="1">ACTIVE</text><text x="24" y="252" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">translate(2px, 2px) while the</text><text x="24" y="270" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#1c1915" text-anchor="start">shadow shrinks, then sits flat.</text><text x="24" y="288" font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size="13" font-weight="400" fill="#56606b" text-anchor="start">No spring, no magnification.</text>
</svg>
